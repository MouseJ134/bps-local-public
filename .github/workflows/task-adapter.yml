name: task-adapter-ci

on:
  push:
    paths:
      - 'adapters/task-adapter/**'
      - '.github/workflows/task-adapter.yml'
      - 'LICENSE'
  pull_request:
    paths:
      - 'adapters/task-adapter/**'
      - '.github/workflows/task-adapter.yml'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    name: Python 3.14 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: adapters/task-adapter
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: adapters/task-adapter/requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Run synthetic and localhost integration tests
        run: python run_tests.py --report test-results.json
      - name: Build source-only ZIP
        run: python scripts/build_zip.py
      - name: Verify packaged sources independently
        run: python scripts/smoke_zip.py
      - name: Upload test report and source ZIP
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: task-adapter-${{ matrix.os }}-${{ github.sha }}
          path: |
            adapters/task-adapter/test-results.json
            adapters/task-adapter/dist/*.zip
            adapters/task-adapter/dist/*.sha256
          if-no-files-found: error
          retention-days: 14
